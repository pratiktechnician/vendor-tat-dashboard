name: Sync Live Dashboard Data

on:
  schedule:
    # Runs automatically every hour (at minute 0 of every hour)
    - cron: '0 * * * *'
  # Allows manual triggering from the GitHub Actions tab in browser
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Latest Data from Google Sheets & Rebuild index.html
        run: |
          node -e "const da = require('./data_analyzer'); da.forceRefresh().then(data => console.log('✅ Refreshed records count:', data ? (data.rawTableData ? data.rawTableData.length : 'OK') : 'Done'));"

      - name: Commit and Push Updated index.html
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || (git commit -m "chore(data): auto-update live dashboard data [skip ci]" && git push)
